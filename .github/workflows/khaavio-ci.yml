name: Khaavio CI

on:
  push:
    branches:
      - main
      - fix/public-menu-voice-alerts-billing-control
      - feat/khaavio-platform-email-automation
  pull_request:

permissions:
  contents: read

concurrency:
  group: khaavio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Install Khaavio Control PWA dependencies
        working-directory: khaavio-superadmin-pwa
        run: npm ci
      - name: Build Khaavio Control PWA
        working-directory: khaavio-superadmin-pwa
        run: npm run build

  platform_email_migration_sql:
    name: Compile and exercise platform email automation migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: khaavio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khaavio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: khaavio_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create minimal platform-email schema fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/khaavio-platform-email-fixture.sql
      - name: Apply platform email migration (skip Supabase-only extension install in vanilla PostgreSQL)
        run: |
          grep -v -E '^create extension if not exists pg_(cron|net);$' supabase/migrations/20261102100000_khaavio_platform_email_automation.sql > /tmp/khaavio-platform-email-migration.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/khaavio-platform-email-migration.sql
      - name: Verify trial, renewal, cancellation, payment issue, expiry, and idempotency behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/khaavio-platform-email-verify.sql

  guest_billing_migration_sql:
    name: Validate guest-billing migration SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: khaavio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khaavio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: khaavio_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create minimal compile-time fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/guest-billing-conflict-fixture.sql
      - name: Apply the migration on disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028003935_guest_billing_conflict_http_status.sql
      - name: Verify both conflict functions retain HTTP 409 mapping
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            v_order_body text;
            v_finalize_body text;
          BEGIN
            SELECT p.prosrc INTO v_order_body
            FROM pg_catalog.pg_proc AS p
            JOIN pg_catalog.pg_namespace AS n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.proname = 'place_public_order_for_guest_with_loyalty';

            SELECT p.prosrc INTO v_finalize_body
            FROM pg_catalog.pg_proc AS p
            JOIN pg_catalog.pg_namespace AS n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.proname = 'khaavio_finalize_guest_tab';

            IF v_order_body IS NULL OR pg_catalog.strpos(v_order_body, 'PT409') = 0 THEN
              RAISE EXCEPTION 'Guest-order conflict is missing PT409 mapping';
            END IF;
            IF v_finalize_body IS NULL OR pg_catalog.strpos(v_finalize_body, 'PT409') = 0 THEN
              RAISE EXCEPTION 'Final-bill conflict is missing PT409 mapping';
            END IF;
            RAISE NOTICE 'PASS: migration applied and both HTTP 409 mappings are present';
          END;
          $verify$;
          SQL

  invoice_payment_migration_sql:
    name: Apply and verify restaurant invoice payment migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: khaavio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khaavio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: khaavio_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create disposable Khaavio billing fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/restaurant-invoice-payments-fixture.sql
      - name: Apply invoice payment migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030203552_restaurant_invoice_upi_payments.sql
      - name: Apply empty session cleanup migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030204300_empty_session_cleanup.sql
      - name: Apply historical Public Menu theme permission migration safely
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101063806_fix_public_menu_theme_upsert_permissions.sql
      - name: Apply and verify Public Menu Theme Studio migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101110000_public_menu_theme_studio.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101130000_fix_public_menu_theme_upsert_permissions.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.restaurant_public_menu_themes (restaurant_id, theme_id)
          VALUES ('00000000-0000-4000-8000-000000000001', 'warm-mocha');

          INSERT INTO public.restaurants (id, owner_id, name, slug, is_published)
          VALUES (
            '00000000-0000-4000-8000-000000000091',
            '00000000-0000-4000-8000-000000000099',
            'Unpublished Restaurant',
            'unpublished-theme-test',
            false
          );

          DO $verify_theme$
          DECLARE
            v_theme_id text;
            v_rls_enabled boolean;
          BEGIN
            SELECT c.relrowsecurity INTO v_rls_enabled
            FROM pg_catalog.pg_class AS c
            JOIN pg_catalog.pg_namespace AS n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relname = 'restaurant_public_menu_themes';

            IF v_rls_enabled IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'Public Menu theme settings must have RLS enabled';
            END IF;

            IF pg_catalog.has_table_privilege('anon', 'public.restaurant_public_menu_themes', 'SELECT') THEN
              RAISE EXCEPTION 'Anonymous users must not directly read restaurant theme settings';
            END IF;
            IF NOT pg_catalog.has_table_privilege('authenticated', 'public.restaurant_public_menu_themes', 'SELECT') THEN
              RAISE EXCEPTION 'Authenticated owner SELECT grant is missing';
            END IF;
            IF NOT pg_catalog.has_column_privilege('authenticated', 'public.restaurant_public_menu_themes', 'restaurant_id', 'UPDATE') THEN
              RAISE EXCEPTION 'Authenticated restaurant_id UPDATE grant is missing for Supabase upsert';
            END IF;
            IF NOT pg_catalog.has_column_privilege('authenticated', 'public.restaurant_public_menu_themes', 'theme_id', 'UPDATE') THEN
              RAISE EXCEPTION 'Authenticated theme_id UPDATE grant is missing';
            END IF;
            IF NOT pg_catalog.has_function_privilege('anon', 'public.khaavio_public_restaurant_menu_theme(text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Public menu theme lookup RPC grant is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'restaurant_public_menu_themes'
                AND policyname = 'restaurant_public_menu_themes_owner_select'
            ) THEN
              RAISE EXCEPTION 'Restaurant owner SELECT policy is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'restaurant_public_menu_themes'
                AND policyname = 'restaurant_public_menu_themes_owner_insert'
            ) THEN
              RAISE EXCEPTION 'Restaurant owner INSERT policy is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'restaurant_public_menu_themes'
                AND policyname = 'restaurant_public_menu_themes_owner_update'
            ) THEN
              RAISE EXCEPTION 'Restaurant owner UPDATE policy is missing';
            END IF;

            SELECT public.khaavio_public_restaurant_menu_theme('green-table') INTO v_theme_id;
            IF v_theme_id IS DISTINCT FROM 'warm-mocha' THEN
              RAISE EXCEPTION 'Published restaurant must expose its saved theme ID';
            END IF;

            SELECT public.khaavio_public_restaurant_menu_theme('unpublished-theme-test') INTO v_theme_id;
            IF v_theme_id IS NOT NULL THEN
              RAISE EXCEPTION 'Unpublished restaurants must not expose their theme ID';
            END IF;

            RAISE NOTICE 'PASS: theme migration, RLS, grants and published-only theme lookup verified';
          END;
          $verify_theme$;
          SQL
      - name: Prepare legacy GST billing fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/complete-gst-billing-baseline.sql
      - name: Apply complete registration-aware GST billing migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101150000_complete_gst_billing.sql
      - name: Apply GST registration GSTIN guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101151000_gst_registration_gstin_required.sql
      - name: Activate final invoice GST snapshot trigger
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101152000_activate_final_invoice_gst_trigger.sql
      - name: Verify GST checkout and final invoice scenarios
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/complete-gst-billing-verify.sql
      - name: Verify grants, public snapshot and staff-verified UPI settlement
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify_schema$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurants'
                AND column_name = 'upi_payment_enabled'
            ) THEN RAISE EXCEPTION 'UPI payment settings columns were not created'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_tables
              WHERE schemaname = 'public'
                AND tablename = 'table_session_invoice_payment_submissions'
            ) THEN RAISE EXCEPTION 'UPI submission ledger was not created'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'table_session_invoice_payment_submissions'
                AND policyname = 'table_session_invoice_payment_submissions_owner_read'
            ) THEN RAISE EXCEPTION 'Owner-only payment submission read policy is missing'; END IF;

            IF pg_catalog.has_table_privilege('anon', 'public.table_session_invoice_payment_submissions', 'SELECT') THEN
              RAISE EXCEPTION 'Anonymous users must not read UPI payment submissions'; END IF;
            IF pg_catalog.has_table_privilege('anon', 'public.restaurants', 'SELECT') THEN
              RAISE EXCEPTION 'UPI ID must not be exposed through public restaurant table SELECT'; END IF;
            IF NOT pg_catalog.has_table_privilege('authenticated', 'public.table_session_invoice_payment_submissions', 'SELECT') THEN
              RAISE EXCEPTION 'Authenticated owner SELECT grant is missing'; END IF;
            IF pg_catalog.has_function_privilege('anon', 'public.khaavio_verify_invoice_upi_payment(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous users must not verify UPI payments'; END IF;
            IF NOT pg_catalog.has_function_privilege('authenticated', 'public.khaavio_verify_invoice_upi_payment(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Authenticated UPI verification grant is missing'; END IF;
            IF NOT pg_catalog.has_function_privilege('anon', 'public.khaavio_submit_public_invoice_upi_payment(text,uuid,uuid,uuid,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Public UPI reference submission grant is missing'; END IF;
            RAISE NOTICE 'PASS: schema, RLS policy and least-privilege grants verified';
          END;
          $verify_schema$;

          UPDATE public.restaurants
          SET upi_payment_enabled = true,
              upi_id = 'green.table@okaxis',
              counter_payment_enabled = true
          WHERE slug = 'green-table';

          SELECT * FROM public.khaavio_public_table_invoice_snapshot(
            'green-table',
            '00000000-0000-4000-8000-000000000003'
          );

          SET ROLE anon;
          SELECT * FROM public.khaavio_select_public_invoice_payment_method(
            'green-table',
            '00000000-0000-4000-8000-000000000003',
            '00000000-0000-4000-8000-000000000005',
            NULL,
            'upi'
          );
          SELECT * FROM public.khaavio_submit_public_invoice_upi_payment(
            'green-table',
            '00000000-0000-4000-8000-000000000003',
            '00000000-0000-4000-8000-000000000005',
            NULL,
            'UPIREF1234567'
          );
          RESET ROLE;

          DO $verify_pending$
          DECLARE
            v_status text;
            v_amount numeric(12,2);
          BEGIN
            SELECT status, amount INTO v_status, v_amount
            FROM public.table_session_invoice_payment_submissions
            WHERE invoice_id = '00000000-0000-4000-8000-000000000005';
            IF v_status IS DISTINCT FROM 'pending' OR v_amount IS DISTINCT FROM 850::numeric THEN
              RAISE EXCEPTION 'Public UPI reference must create a pending record for the exact invoice amount';
            END IF;
            IF (SELECT payment_status FROM public.table_session_invoices
                WHERE id = '00000000-0000-4000-8000-000000000005') <> 'unpaid' THEN
              RAISE EXCEPTION 'Customer submission must never mark an invoice paid';
            END IF;
            IF public.khaavio_public_table_invoice_snapshot('green-table', '00000000-0000-4000-8000-000000000003') -> 'invoice' ->> 'payment_choice' <> 'upi' THEN
              RAISE EXCEPTION 'Public invoice snapshot does not expose the selected UPI method';
            END IF;
          END;
          $verify_pending$;

          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000099';
          SET ROLE authenticated;
          SELECT * FROM public.khaavio_verify_invoice_upi_payment(
            (SELECT id FROM public.table_session_invoice_payment_submissions
             WHERE invoice_id = '00000000-0000-4000-8000-000000000005')
          );
          RESET ROLE;
          RESET request.jwt.claim.sub;

          DO $verify_paid$
          BEGIN
            IF (SELECT payment_status FROM public.table_session_invoices
                WHERE id = '00000000-0000-4000-8000-000000000005') <> 'paid' THEN
              RAISE EXCEPTION 'Verified UPI credit did not settle the existing invoice'; END IF;
            IF (SELECT status FROM public.table_session_invoice_payment_submissions
                WHERE invoice_id = '00000000-0000-4000-8000-000000000005') <> 'verified' THEN
              RAISE EXCEPTION 'UPI submission did not transition to verified'; END IF;
            RAISE NOTICE 'PASS: public submission stays unpaid; owner verification settles invoice';
          END;
          $verify_paid$;

          SELECT * FROM public.khaavio_public_table_invoice_snapshot(
            'green-table',
            '00000000-0000-4000-8000-000000000003'
          );

          INSERT INTO public.table_session_invoices (
            id, restaurant_id, table_id, session_id, invoice_number, total_amount,
            subtotal_amount, order_count, payment_status
          ) VALUES (
            '00000000-0000-4000-8000-000000000008',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000004',
            'KHV-TEST-0002', 450, 450, 1, 'unpaid'
          );

          SET ROLE anon;
          SELECT * FROM public.khaavio_select_public_invoice_payment_method(
            'green-table',
            '00000000-0000-4000-8000-000000000003',
            '00000000-0000-4000-8000-000000000008',
            NULL,
            'upi'
          );
          SELECT * FROM public.khaavio_submit_public_invoice_upi_payment(
            'green-table',
            '00000000-0000-4000-8000-000000000003',
            '00000000-0000-4000-8000-000000000008',
            NULL,
            'UPIREF2234567'
          );
          RESET ROLE;

          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000099';
          SET ROLE authenticated;
          SELECT * FROM public.mark_table_invoice_paid(
            '00000000-0000-4000-8000-000000000008', 'Cash'
          );
          RESET ROLE;
          RESET request.jwt.claim.sub;

          DO $verify_manual_settlement$
          BEGIN
            IF (SELECT status FROM public.table_session_invoice_payment_submissions
                WHERE invoice_id = '00000000-0000-4000-8000-000000000008') <> 'rejected' THEN
              RAISE EXCEPTION 'A different/manual settlement must close the pending UPI reference';
            END IF;
            RAISE NOTICE 'PASS: non-UPI manual settlement closes stale UPI submissions';
          END;
          $verify_manual_settlement$;
          SQL

      - name: Verify empty guest tabs and cancelled-only sessions can close safely
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.table_sessions (
            id, restaurant_id, table_id, status, billing_mode
          ) VALUES (
            '00000000-0000-4000-8000-000000000010',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            'open',
            'per_guest'
          );

          INSERT INTO public.table_session_tabs (
            id, restaurant_id, table_id, session_id, guest_tab_token, status, display_name
          ) VALUES
            (
              '00000000-0000-4000-8000-000000000011',
              '00000000-0000-4000-8000-000000000001',
              '00000000-0000-4000-8000-000000000002',
              '00000000-0000-4000-8000-000000000010',
              '00000000-0000-4000-8000-000000000021',
              'open',
              'Guest A'
            ),
            (
              '00000000-0000-4000-8000-000000000012',
              '00000000-0000-4000-8000-000000000001',
              '00000000-0000-4000-8000-000000000002',
              '00000000-0000-4000-8000-000000000010',
              '00000000-0000-4000-8000-000000000022',
              'open',
              'Guest B'
            );

          INSERT INTO public.orders (
            id, restaurant_id, table_id, session_id, guest_tab_id,
            customer_name, status, total_amount
          ) VALUES (
            '00000000-0000-4000-8000-000000000013',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000010',
            '00000000-0000-4000-8000-000000000011',
            'Guest A',
            'cancelled',
            100
          );

          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000099';
          SET ROLE authenticated;
          SELECT * FROM public.close_empty_guest_tab('00000000-0000-4000-8000-000000000011');
          RESET ROLE;

          DO $verify_one_guest$
          BEGIN
            IF (SELECT status FROM public.table_session_tabs
                WHERE id = '00000000-0000-4000-8000-000000000011') <> 'closed' THEN
              RAISE EXCEPTION 'Cancelled-only guest tab was not closed';
            END IF;
            IF (SELECT status FROM public.table_sessions
                WHERE id = '00000000-0000-4000-8000-000000000010') <> 'open' THEN
              RAISE EXCEPTION 'Closing one guest tab must leave another active guest session open';
            END IF;
          END;
          $verify_one_guest$;

          SET ROLE authenticated;
          SELECT * FROM public.close_empty_guest_tab('00000000-0000-4000-8000-000000000012');
          RESET ROLE;
          RESET request.jwt.claim.sub;

          DO $verify_guest_session$
          BEGIN
            IF (SELECT status FROM public.table_sessions
                WHERE id = '00000000-0000-4000-8000-000000000010') <> 'closed' THEN
              RAISE EXCEPTION 'Table session must close after every guest tab is closed';
            END IF;
            IF (SELECT closed_at FROM public.table_sessions
                WHERE id = '00000000-0000-4000-8000-000000000010') IS NULL THEN
              RAISE EXCEPTION 'Closed guest session must have a close timestamp';
            END IF;
          END;
          $verify_guest_session$;

          INSERT INTO public.table_sessions (
            id, restaurant_id, table_id, status, billing_mode
          ) VALUES (
            '00000000-0000-4000-8000-000000000014',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            'open',
            'combined'
          );
          INSERT INTO public.orders (
            id, restaurant_id, table_id, session_id, customer_name, status, total_amount
          ) VALUES (
            '00000000-0000-4000-8000-000000000015',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000014',
            'Guest',
            'cancelled',
            250
          );

          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000099';
          SET ROLE authenticated;
          SELECT * FROM public.close_empty_table_session('00000000-0000-4000-8000-000000000014');
          RESET ROLE;
          RESET request.jwt.claim.sub;

          DO $verify_combined_session$
          BEGIN
            IF (SELECT status FROM public.table_sessions
                WHERE id = '00000000-0000-4000-8000-000000000014') <> 'closed' THEN
              RAISE EXCEPTION 'Cancelled-only combined session was not closed';
            END IF;
          END;
          $verify_combined_session$;

          INSERT INTO public.table_sessions (
            id, restaurant_id, table_id, status, billing_mode
          ) VALUES (
            '00000000-0000-4000-8000-000000000016',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            'open',
            'combined'
          );
          INSERT INTO public.orders (
            id, restaurant_id, table_id, session_id, customer_name, status, total_amount
          ) VALUES (
            '00000000-0000-4000-8000-000000000017',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000016',
            'Guest',
            'completed',
            250
          );

          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000099';
          SET ROLE authenticated;
          DO $reject_non_empty$
          BEGIN
            PERFORM public.close_empty_table_session('00000000-0000-4000-8000-000000000016');
            RAISE EXCEPTION 'A session with a non-cancelled order must not close';
          EXCEPTION WHEN SQLSTATE '55000' THEN
            RAISE NOTICE 'PASS: active order prevents empty-session closure';
          END;
          $reject_non_empty$;
          RESET ROLE;
          RESET request.jwt.claim.sub;

          INSERT INTO public.table_sessions (
            id, restaurant_id, table_id, status, billing_mode
          ) VALUES (
            '00000000-0000-4000-8000-000000000018',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            'open',
            'per_guest'
          );
          INSERT INTO public.table_session_tabs (
            id, restaurant_id, table_id, session_id, guest_tab_token, status, display_name
          ) VALUES (
            '00000000-0000-4000-8000-000000000019',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000018',
            '00000000-0000-4000-8000-000000000029',
            'open',
            'Guest C'
          );
          INSERT INTO public.orders (
            id, restaurant_id, table_id, session_id, guest_tab_id,
            customer_name, status, total_amount
          ) VALUES (
            '00000000-0000-4000-8000-000000000030',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000018',
            '00000000-0000-4000-8000-000000000019',
            'Guest C',
            'completed',
            99
          );

          SET request.jwt.claim.sub = '00000000-0000-4000-8000-000000000099';
          SET ROLE authenticated;
          DO $reject_non_empty_guest$
          BEGIN
